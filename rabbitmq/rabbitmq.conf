# Settings of the single RabbitMQ instance of the platform (ADR-036). Everything the instance needs to stay inside
# explicit limits (Norma 5.3.10) is written here; the logins and the exchanges come from the rendered definitions.
load_definitions = /etc/rabbitmq/definitions.json

# A message above 128 KiB is rejected at the broker.
max_message_size = 131072

# The broker blocks the publishers when the free disk or the memory crosses these bounds, instead of failing later.
disk_free_limit.absolute = 1GB
vm_memory_high_watermark.relative = 0.4
